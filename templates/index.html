{% extends 'base.html' %}

{% block meta %}
<title>{{ name }} Portofolio</title>
{% endblock meta %}

{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/avatar.jpeg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/OkehBero" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/dave-wesley-tjoeng-05a65b380/" class="social-link">LinkedIn</a>
                        <a href="mailto:davetjoeng854@gmail.com" class="social-link">Email</a>
                    </div>
                    <div class="hero-skills">
                        <span class="skills-title">Skills</span>
                        <ul>
                            <li class="skill-primary">Python</li>
                            <li class="skill-success">Java</li>
                            <li class="skill-info">English</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
