<button type="button"
        class="button button-danger"
        popovertarget="delete-exp-{{ experience.id }}"
        aria-label="Hapus {{ experience.title }}">
  Hapus
</button>

<div id="delete-exp-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-exp-title-{{ experience.id }}">
  <button type="button"
          class="project-delete-modal_backdrop"
          popovertarget="delete-exp-{{ experience.id }}"
          popovertargetaction="hide"
          aria-label="Tutup"></button>
  <div class="project-delete-modal_content">
    <button type="button"
            class="project-delete-modal_close"
            popovertarget="delete-exp-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup">×</button>
    <h2 id="delete-exp-title-{{ experience.id }}">Hapus Pengalaman?</h2>
    <p>Apakah kamu yakin ingin menghapus pengalaman <strong>{{ experience.title }}</strong>?</p>
    <div class="project-delete-modal_actions">
      <button type="button"
              class="button button-secondary"
              popovertarget="delete-exp-{{ experience.id }}"
              popovertargetaction="hide">Batal</button>
      <form method="post" action="{% url 'main:delete_experience' experience.id %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">Ya, Hapus</button>
      </form>
    </div>
  </div>
</div>
